[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attnres-vit"
version = "0.1.0"
description = "Block Attention Residuals for Vision Transformers"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=1.0.0",
    "pyyaml>=6.0",
    "tensorboard>=2.14.0",
]

[tool.setuptools.packages.find]
include = ["attnres_vit*"]
