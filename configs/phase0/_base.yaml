# Shared ImageNet-1K training recipe (DeiT-style, suitable for ViT from scratch)
# Override per-experiment: model, experiment slug
#
# Reproducibility:
#   seed: 42 (timm default; rank offset applied per GPU)
#   worker_seeding: all (dataloader workers derive from seed)
#   For stricter mode: ATTNRES_DETERMINISTIC=1 bash scripts/train_4gpu.sh ...
#
# Output naming (set by scripts/train_4gpu.sh):
#   output/phase0/{YYYYMMDD_HHMMSS}_{experiment}_s{seed}/

seed: 42
worker_seeding: all

data_dir: /data/imagenet
train_split: train
val_split: val

img_size: 224
batch_size: 128
validation_batch_size: 256
epochs: 300
cooldown_epochs: 10

opt: adamw
lr: 0.001
weight_decay: 0.05
sched: cosine
warmup_lr: 1.0e-6
min_lr: 1.0e-5
warmup_epochs: 5

amp: true
channels_last: true
model_ema: true
model_ema_decay: 0.9999

mixup: 0.8
cutmix: 1.0
mixup_mode: batch
mixup_off_epoch: 0

aa: rand-m9-mstd0.5-inc1
color_jitter: 0.4
reprob: 0.25
remode: pixel
recount: 1

workers: 8
pin_mem: true
prefetcher: true

log_interval: 50
checkpoint_hist: 10

# Logging
log_wandb: false
